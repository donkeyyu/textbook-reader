": "ch1-positive-negative", "title": "这里的“−”在说明一个数", "preview": "−3是一个数；这里的负号不要求先做一道减法。", "paragraphs": ["在“−3”中，负号和3合在一起表示一个负数，应读成一个整体“负3”。这里的负号不表示两个数相减。", "同一个“−”也能在两个数之间表示减法，例如补充用例“5−3”。判断符号的作用，要看它在整个式子中的位置。当前定义中的“−”写在正数前面，用来表示对应的负数。"], "learningRole": "定义概念", "learningGap": "负号与减号形状相同，原定义没有对比单个负数与减法算式的读取方式。", "learningAction": "能把单个负数整体读出，并区分负号与两个数之间的减号。", "related": []}, {"id": "ch1-zero-boundary", "locationId": "ch1-zero-boundary", "title": "为什么0要单独留下？", "preview": "正数与负数分居0的两边，0本身不属于任何一边。", "paragraphs": ["正数的条件是“大于0”，0不满足这个条件；负数对应分界点另一侧的数，0也没有落在那一侧。它是两边共同的分界点，而不是其中一类的成员。", "因此，判断数的符号时，应留出“等于0”这一种情况。没有负号，不能单凭这一点就判为正数；补充用例0、+0和−0都表示同一个0。"], "learningRole": "定义概念", "learningGap": "原文给出了0的归属结论，但未连起严格大于条件、分界点与按符号分类的三种情况。", "learningAction": "能在正、负之外单独检查0，解释为什么没有负号不足以判定正数。", "related": []}, {"id": "ch1-opposite-meanings", "locationId": "ch1-opposite-meanings", "title": "“相反意义”不要求数量相等", "preview": "先找同一种量的两个相反方面，再谈多大或多少。", "paragraphs": ["这里的“相反”说的是数量的意义，例如增加与减少、超过标准与不足标准。它们属于同一种比较，却朝相反的方向变化。", "两个方面的数量不必相等。章引言中的盈利50万元和亏损10万元，金额不同，仍可分别用正数和负数表示。不能因为一个数带正号、另一个带负号，就认为两者的数量大小相同。"], "learningRole": "陈述性质或结论", "learningGap": "一般表述易让相反意义与数量相等混在一起，需要分清方向与数量两个信息。", "learningAction": "能判断哪些量具有相反意义，并说明数量不等也可分别用正负数记录。", "related": []}, {"id": "ch1-example-1-1-guide", "locationId": "ch1-example-1-1-guide", "title": "1.1例1：比标准质量多或少", "preview": "正负号要和“超过标准质量的克数”一起读。", "paragraphs": [], "learningRole": "示范方法", "learningGap": "两问方向相反：先把偏差写成数，再把数读回偏差。", "learningAction": "能在偏差的文字描述与带符号记录之间双向转换。", "related": [{"locationId": "ch1-source-standard-comparison", "label": "例1对正数的约定", "purpose": "回到题干“用正数表示超过标准质量的克数”，再检查每个记录怎样读。"}], "questionGuide": {"knowledgePoints": ["题目规定用正数表示比2.5 kg标准质量多出的克数；比标准少的克数就用负数表示。"], "method": ["第（1）问把“比标准多”“比标准少”分别对应到给定记法。", "第（2）问把符号读成多或少，再读出克数；每个数都要和同一个标准质量比较。"], "cautions": ["2.5 kg是标准质量，g记录的是多或少的克数；两者不是同一个数。"]}}, {"id": "ch1-deviation", "locationId": "ch1-deviation", "title": "−27 g说的是比标准少多少", "preview": "−27 g表示少27 g，没有说这箱橘子的质量是负数。", "paragraphs": ["题干先 measurement-exercise", "title": "习题1.1第6题", "preview": "同一组数据，楼高记录与偏差记录有何区别？", "paragraphs": ["这道题中的原始数据记录楼高；接下来要记录的数表示“比同一个标准多或少多少”。它们记录的量不同，因此不能只看原始数据是否大于0，就决定偏差的符号。", "题目指定平均值为标准。这个共同标准使七组偏差可以直接比较；不能为每组另换参照。"], "learningRole": "练习", "learningGap": "先确定所有数据共用的平均值，再以它为标准逐个记录偏差。", "learningAction": "能求数据平均值并以统一标准自主记录七组偏差。", "related": [{"locationId": "ch1-source-standard-comparison", "label": "例1怎样记录比标准多或少", "purpose": "把橘子题的标准换成本题指定的平均值，检查比平均值高或低的记录。"}], "questionGuide": {"knowledgePoints": ["平均值=七组测量结果的和÷7；题目指定用这个平均值作统一标准。", "用正数记录比这个标准高多少米，用负数记录低多少米；恰好等于标准时记0。"], "method": ["把单位相同的测量值相加，再用总和除以测量值的个数，得到所有记录共用的平均值。", "记录偏差时，每组都与刚得到的同一个平均值比较，分别确定方向与差距；最后逐组对照原始数据。"], "cautions": ["楼高测量值与偏差是两种不同记录；不要用前一组数据替代平均值作下一组的标准，也不要漏掉可能等于标准的情形。"]}}, {"id": "ch1-exercise-1-1-7", "locationId": "ch1-exercise-1-1-7", "title": "习题1.1第7题", "preview": "两次下降按时间顺序发生，后一次以当时温度为起点。", "paragraphs": [], "learningRole": "练习", "learningGap": "两次下降按时间顺序发生，后一次以当时温度为起点。", "learningAction": "能按时间顺序处理连续温度变化，并自主读取最终温度。", "related": [{"locationId": "ch1-source-temperature-sign", "label": "正温度和负温度怎样读", "purpose": "温度经过0 ℃后，继续沿同一刻度判断是零上还是零下。"}], "questionGuide": {"knowledgePoints": ["题目从某个已有温度开始，先后两次下降；“下降了多少℃”与“下降后多少℃”要分开读。"], "method": ["先核对题目所问时刻与两段时间的关系，再用温度计示意图按顺序追踪温度的变化。"], "cautions": ["第二次下降不是重新从最初温度开始；若温度变化经过0 ℃，应继续按同一刻度和方向读数。"]}}, {"id": "ch1-exercise-1-1-8", "locationId": "ch1-exercise-1-1-8", "title": "习题1.1第8题", "preview": "密码记录每次怎样转，不是直接给出每次停在哪个刻度。", "paragraphs": [], "learningRole": "探究", "learningGap": "密码记录每次怎样转，不是直接给出每次停在哪个刻度。", "learningAction": "能按同一旋转约定解释两组密码并自主追踪最终刻度。", "related": [{"locationId": "ch1-direction-exercise", "label": "连续移动与最终位置", "purpose": "比较每次移动记录与连续移动后的最终位置。"}], "questionGuide": {"knowledgePoints": ["题目规定“+”按逆时针转、“−”按顺时针转；数值表示这一次转过几格，刻度仍要按图中圆盘读取。"], "method": ["分别记录每次转动后的刻度。下一次从刚停下的位置继续转，不能每次回到0。", "读第二组密码时，逐次对照正负号规定的方向，并分清转盘刻度与固定标记线。"], "cautions": ["只在开始开锁前对齐0，不是每次转动前都回到0；锁盘是环形，越过0时应沿原图刻度继续读，不能把负的转动记录直接当作锁盘上的刻度数。"]}}, {"id": "ch1-tolerance-range", "locationId": "ch1-tolerance-range", "title": "±记录允许的范围，不是一次测量值", "preview": "一个球只有一个实际直径；±0.05 mm给出向两侧偏离的限度。", "paragraphs": ["“40 mm±0.05 mm”包含标准值和允许偏差两部分。±不是说一个球同时有两个直径，而是规定实际直径可以比40 mm稍大，也可以稍小。", "允许偏差还包含两端之间的数，不只允许“恰好多0.05 mm”或“恰好少0.05 mm”。例如补充用例，偏差为+0.02 mm也在允许范围内；判断是否合格，要检查实际偏差有没有超过规定的上下限。"], "learningRole": "陈述性质或结论", "learningGap": "原文列出最大最小直径，但±容易被当成两种离散测量结果，需要区分标准、实际值与允许区间。", "learningAction": "能区分实际测量值与允许偏差，并判断区间内部的偏差也属于允许范围。", "related": [{"locationId": "ch1-deviation", "label": "回顾实际质量和偏差", "purpose": "把实际值与偏离标准多少分开，再理解允许偏差。"}]}, {"id": "ch1-tolerance-question", "locationId": "ch1-tolerance-question", "title": "阅读与思考：用正负数表示允许偏差", "preview": "允许偏差描述一个范围，标准值与偏差各起什么作用？", "paragraphs": [], "learningRole": "探究", "learningGap": "解释允许偏差时，要同时说清标准、上下限和中间允许的范围。", "learningAction": "能解释质量允许偏差，并给出约定和单位明确的另一例子。", "related": [{"locationId": "ch1-tolerance-range", "label": "允许偏差的范围", "purpose": "回看直径说明，迁移到质量规格。"}], "questionGuide": {"knowledgePoints": ["原文用“标准直径±允许偏差”说明允许多大、允许小到什么程度；范围内的数值都要考虑。"], "method": ["仿照直径说明，先识别质量规格中的标准和允许偏差，再用文字说明实际质量被允许落在什么范围。", "另举例时，可选一个有明确规格的物品，写出标准、偏差和单位，并说明哪些实际值合格；自拟数据要明确标为举例。"], "cautions": ["±给出两侧限度，不是说物品同时有两个质量；不要只列两个端点而遗漏它们之间的允许值。"]}}, {"id": "ch1-rational-think", "locationId": "ch1-rational-think", "title": "1.2.1思考：已经认识了哪些数", "preview": "回顾时既列具体例子，也检查数的种类有没有遗漏。", "paragraphs": [], "learningRole": "回顾与整理", "learningGap": "回顾时既列具体例子，也检查数的种类有没有遗漏。", "learningAction": "能列举已学数并用明确依据整理它们。", "related": [{"locationId": "ch1-rational-form", "label": "数值与写法", "purpose": "检查回顾时是否把相同数的不同写法当成不同类别。"}, {"locationId": "ch1-source-positive-negative", "label": "正数、负数与0的规定", "purpose": "回看教材对正数、负数和0的规定，再判断本题中的数。"}], "questionGuide": {"knowledgePoints": ["正整数、0、负整数统称为整数；小学学过的分数、小数，也要连同上一节引入的负数一起回顾。"], "method": ["先从计数、测量和上一节的情境各选一些已认识的数，再尝试按同一标准整理；给每一类写一个能说明其特点的例子。"], "cautions": ["同一个数可能有多种写法，不要把写法变化当作增加一种新数；分类标准应说清，避免一会儿按符号、一会儿只按小数点分组。"]}}, {"id": "ch1-decimal-rational", "locationId": "ch1-decimal-rational", "title": "小数的写法，也可以表示有理数", "preview": "要判断能否写成分数，不能只看有没有小数点。", "paragraphs": ["有限小数能利用小数位数改写成分数。补充用例：0.25表示25个百分之一，所以0.25=25/100=1/4。小数形式和分数形式可以记录同一个数。", "循环小数中的点表示指定数字会按同一规律不断重复，而不是到这里停止。教材旁注的循环小数与1/3对应；判断它属于有理数，依据是能够写成分数，不是把它截成有限位后的近似数。", "并不是所有小数都能写成两个整数的比（分母不为0）。小数部分无限延伸、又不循环的小数，就不能这样表示；这类数以后会学习。"], "learningRole": "陈述性质或结论", "learningGap": "旁注直接说明两类小数可化成分数，需要明确有限小数转换依据与循环记号不是有限位截断。还需提醒这两类小数不能代表全部小数。", "learningAction": "能解释有限小数为何可改写为分数，并区分循环小数本身与有限位近似写法。不把本页结论推广为所有小数都能写成分数。", "related": []}, {"id": "ch1-rational-form", "locationId": "ch1-rational-form", "title": "写成分数，不会改变数的类别", "preview": "分数形式是一种写法，整数也能使用这种写法。", "paragraphs": ["“整数可以写成分数的形式”是在说同一个数能有不同写法。补充用例：6/3和2.0都表示整数2，写出分数线或小数点并不会把2变成非整数。", "因此要分清“是整数”和“能写成分数形式”这两句话。前者判断数的类别，后者判断它能怎样表示；一个整数可以同时满足两句话。"], "learningRole": "定义概念", "learningGap": "分数线、小数点等写法容易被当作判断整数的依据，需要区分数值与表示形式。", "learningAction": "能按数值判断整数，解释整数写成分数形式后仍是整数。", "related": []}, {"id": "ch1-rational-denominator", "locationId": "ch1-rational-denominator", "title": "“分数形式”要满足什么条件？", "preview": "分子和分母都取整数，分母还必须非0。", "paragraphs": ["这里的分数形式，是用一个整数作分子、一个非0整数作分母。只要一个数能这样表示，它就是有理数；不要求它眼下已经写成分数。", "分母不能为0，因为这会要求做除以0的运算。分子可以为0，例如教材中的0/1，所以0也是有理数。正数、负数之外的0，并没有被有理数的定义排除。"], "learningRole": "定义概念", "learningGap": "原定义简写分数形式，未单独列清整数分子、非零整数分母及分子可为0的条件。", "learningAction": "能判断一种表示是否满足有理数分数形式的条件，并说明0属于有理数。", "related": [{"locationId": "ch1-source-positive-negative", "label": "正数、负数与0的规定", "purpose": "回看教材对正数、负数和0的规定，再判断本题中的数。"}]}, {"id": "ch1-example-1-2-1-guide", "locationId": "ch1-example-1-2-1-guide", "title": "1.2例1：正负有理数与正负整数", "preview": "先依据有理数的定义辨认数的范围，再分别判断正负和是否为整数。", "paragraphs": [], "learningRole": "示范方法", "learningGap": "分类的起点是有理数的定义；还需把数的不同写法与正负、整数两项判断联系起来。", "learningAction": "能依据有理数定义辨认不同写法的归属，再按正负与整数属性交叉分类并说明判断依据。", "related": [{"locationId": "ch1-source-integer-types", "label": "整数包括哪些数", "purpose": "回看正整数、0、负整数统称为整数的原文，再判断本题中的整数。"}, {"locationId": "ch1-source-fraction-types", "label": "正分数与负分数", "purpose": "对照课本列出的分数和小数，分清数的类别与写法。"}, {"locationId": "ch1-source-rational-definition", "label": "有理数的原文定义", "purpose": "确认教材怎样规定有理数，再读本题要求辨认哪些数。"}, {"locationId": "ch1-decimal-rational", "label": "小数与有理数", "purpose": "核对循环记号及小数表示。"}], "questionGuide": {"knowledgePoints": ["可以写成分数形式的数叫有理数；能写成正分数形式的是正有理数，能写成负分数形式的是负有理数。", "正整数、0、负整数统称为整数；有限小数和无限循环小数都能化为分数，分类时要按数值判断，不能只看写法。"], "method": ["先回顾有理数的定义：整数、分数、有限小数和无限循环小数都能写成符合条件的分数，所以可以在有理数范围内分类。", "再按符号区分正、负有理数，并在各类中检查哪些数的值是整数；对百分数和循环小数先读懂其数值含义，可用分类表核对四项要求是否都有回应。"], "cautions": ["“其中”表示从已经列出的类别中继续选，不能把四种名称当作互不重叠的四组；不要仅凭分数线或小数点判断整数。"]}}, {"id": "ch1-classification-overlap", "locationId": "ch1-classification-overlap", "title": "“其中”说明两类数是什么关系？", "preview": "先按正负分组，再在组内找整数，不是在分互不相交的四组。", "paragraphs": ["“正有理数”按正负来判断，“整数”按数值是不是整数来判断。两种条件可以同时满足，所以解答先列正有理数，再从这些数中找正整数。", "补充用例：2既是正有理数，也是整数；−2既是负有理数，也是整数；0是整数和有理数，却不属于正有理数或负有理数。分类前先说清依据，才能判断一个数是否可以出现在不止一类中。"], "learningRole": "示范方法", "learningGap": "例1列举了嵌套类别，但未展开其中一词体现的包含关系和两种分类标准。", "learningAction": "能按符号和整数属性分别判断，并解释同一个数为何可以属于两类。", "related": [{"locationId": "ch1-rational-form", "label": "回看写法与类别", "purpose": "核对分数线或小数点不能单独决定整数属性。"}]}, {"id": "ch1-practice-p8-1", "locationId": "ch1-practice-p8-1", "title": "练习第1题", "preview": "集合名称给出归属条件，按条件逐个放入所给数。", "paragraphs": [], "learningRole": "练习", "learningGap": "集合名称给出归属条件，按条件逐个放入所给数。", "learningAction": "能按集合的符号条件整理所给有理数。", "related": [{"locationId": "ch1-source-integer-types", "label": "整数包括哪些数", "purpose": "回看正整数、0、负整数统称为整数的原文，再判断本题中的整数。"}, {"locationId": "ch1-source-fraction-types", "label": "正分数与负分数", "purpose": "对照课本列出的分数和小数，分清数的类别与写法。"}, {"locationId": "ch1-source-rational-definition", "label": "有理数的原文定义", "purpose": "确认教材怎样规定有理数，再读本题要求辨认哪些数。"}, {"locationId": "ch1-source-positive-negative", "label": "正数、负数与0的规定", "purpose": "回看教材对正数、负数和0的规定，再判断本题中的数。"}], "questionGuide": {"knowledgePoints": ["正有理数集合由所有正有理数组成，负有理数集合由所有负有理数组成；题目所给各数已经是有理数，填写时逐个核对正负。"], "method": ["先说清每个集合接收什么样的数，再逐个核对所给数的符号；填写后回到原列表检查是否漏项或重复。"], "cautions": ["省略号表示这类数不止题目列出的几个，不要求你继续编造新数；不能只看一个数写成整数还是分数来决定正负集合。"]}}, {"id": "ch1-practice-p8-2", "locationId": "ch1-practice-p8-2", "title": "练习第2题", "preview": "三个名称用了两种分类标准，某个数可以满足不止一个。", "paragraphs": [], "learningRole": "练习", "learningGap": "三个名称用了两种分类标准，某个数可以满足不止一个。", "learningAction": "能在三类之间保留正确的交叉归属，并正确处理0和带分数。", "related": [{"locationId": "ch1-source-integer-types", "label": "整数包括哪些数", "purpose": "回看正整数、0、负整数统称为整数的原文，再判断本题中的整数。"}, {"locationId": "ch1-source-fraction-types", "label": "正分数与负分数", "purpose": "对照课本列出的分数和小数，分清数的类别与写法。"}, {"locationId": "ch1-source-rational-definition", "label": "有理数的原文定义", "purpose": "确认教材怎样规定有理数，再读本题要求辨认哪些数。"}, {"locationId": "ch1-rational-form", "label": "写法与数值", "purpose": "判断整数时以数值为准。"}], "questionGuide": {"knowledgePoints": ["课本把可以写成分数形式的数叫作有理数；有限小数和无限循环小数也能化为分数。", "正有理数、负有理数按正负区分；整数包括正整数、0和负整数。0既不是正数，也不是负数，所以这三项要分别核对。"], "method": ["分别建立符号和是否为整数两项判断，再按题目要求列出三类；对带分数先读出完整数值再分类。"], "cautions": ["整数一栏不能只检查前两栏有没有出现过这个数；0需依相应定义单独判断，不能凭外观省略。"]}}, {"id": "ch1-practice-p8-3", "locationId": "ch1-practice-p8-3", "title": "练习第3题", "preview": "四个空格的类别之间是什么关系？", "paragraphs": [], "learningRole": "练习", "learningGap": "先分类再计数，比边读边报个数更容易核对。", "learningAction": "能先建立逐数分类记录，再自主统计四类数量。", "related": [{"locationId": "ch1-source-integer-types", "label": "整数包括哪些数", "purpose": "回看正整数、0、负整数统称为整数的原文，再判断本题中的整数。"}, {"locationId": "ch1-source-fraction-types", "label": "正分数与负分数", "purpose": "对照课本列出的分数和小数，分清数的类别与写法。"}, {"locationId": "ch1-source-rational-definition", "label": "有理数的原文定义", "purpose": "确认教材怎样规定有理数，再读本题要求辨认哪些数。"}, {"locationId": "ch1-decimal-rational", "label": "循环小数", "purpose": "正确读取循环点再判断数值。"}], "questionGuide": {"knowledgePoints": ["课本把可以写成分数形式的数叫作有理数；有限小数和无限循环小数也能化为分数。", "先按正负判断有理数的类别，再在每类中检查正整数或负整数；“其中”表示继续从前一类中选，不能另起一组数来数。"], "method": ["给每个数分别标出符号与是否为整数，再据此统计四个空格要求的类别。", "统计后检查“其中”的关系：每类整数是否都来自相应的有理数类别。"], "cautions": ["百分号和循环点属于数的写法，不能看漏；不要把“正有理数个数”误读成“正分数个数”，也不要因一个数满足两项条件就漏记。"]}}, {"id": "ch1-road-question", "locationId": "ch1-road-question", "title": "1.2.2问题：画图表示马路旁物体的位置", "preview": "道路简图需要保留哪些位置关系？", "paragraphs": [], "learningRole": "示范方法", "learningGap": "画图前先定共同基准、方向和尺度，再把四个物体放到图上。", "learningAction": "能按统一基准和比例画出道路上各物体的相对位置。", "related": [{"locationId": "ch1-road-model", "label": "道路图保留什么信息", "purpose": "明确简图需要保留的基准、方向和尺度。"}, {"locationId": "ch1-number-line-unit", "label": "统一单位长度", "purpose": "检查各段距离是否按同一尺度表达。"}], "questionGuide": {"knowledgePoints": ["题干分别给出物体在汽车站的东侧或西侧，以及离汽车站多少米；图中要同时保留方向和距离。", "用直线表示道路时，每一个单位长度代表的实际长度应相同，才能据图比较物体的位置。"], "method": ["图需要让别人辨认物体在参照点哪一侧、离它多远。你选择的图能同时表达这两条信息吗？", "可对照题干核查同侧的两个物体：图中距离有没有使用同一尺度？"], "cautions": ["不能把相邻物体间距与到汽车站的距离混读；图上不同位置必须使用同一比例，不必画出物体的外形。"]}}, {"id": "ch1-road-model", "locationId": "ch1-road-model", "title": "为什么一条直线就能表示这条路？", "preview": "这道题只需要沿路的相对位置，图中可以保留这些信息。", "paragraphs": ["题目只问各物体在车站的东边还是西边、离车站多远。树的形状、路的宽度都不影响这两个问题，因此可以用一条直线和几个点来画。", "画图时仍要保留汽车站的位置、东西方向和相同的单位长度，才能按图读出题目给的距离。"], "learningRole": "示范方法", "learningGap": "原文给出道路图的画法，但未说明为何可以忽略实物外形并只保留一维位置。", "learningAction": "能说出道路图省略和保留的信息，说明这一简化为什么支持当前定位问题。", "related": [{"locationId": "ch1-road-number", "label": "图中的数怎样表示物体位置", "purpose": "对照车站、东西方向和距离，读柳树与电线杆所对应的数。"}]}, {"id": "ch1-road-think", "locationId": "ch1-road-think", "title": "思考：用数表示相对位置", "preview": "每个位置要同时带上方向和距离信息，单独一个正距离还不够。", "paragraphs": [], "learningRole": "探究", "learningGap": "每个位置要同时带上方向和距离信息，单独一个正距离还不够。", "learningAction": "能用一致的符号与尺度表示图中物体相对位置。", "related": [{"locationId": "ch1-road-number", "label": "图中的数怎样表示物体位置", "purpose": "对照汽车站、东西方向和到站距离，读图中各物体对应的数。"}], "questionGuide": {"knowledgePoints": ["东与西、左与右具有相反意义，可以用正负数区分；表示位置的数还需说明离汽车站多远。", "图中各个数要共用同一个0、同一个单位长度和同一套正负约定，才能读出物体之间的位置关系。"], "method": ["如果只记到汽车站的距离，能区分两侧的物体吗？尝试用已有正负数表示法补足图中缺少的信息，并说明你的约定。"], "cautions": ["约定要对所有物体一致；图中两点相隔多少米，不能直接当作某个点对应的数。"]}}, {"id": "ch1-road-number", "locationId": "ch1-road-number", "title": "一个数怎样表示物体的位置？", "preview": "正负号区分车站的东西两侧，数值说明离车站多远。", "paragraphs": ["图1.2-2把汽车站定为0，向东记正、向西记负。图中的3表示柳树在车站东边3 m，−4.8表示电线杆在车站西边4.8 m；符号和数值分别说明哪一侧、离多远。", "这些数要连同“哪里作0、哪边为正、每格多长”一起读。若改用别处作0，同一棵树所对应的数会改变，树本身并没有移动。"], "learningRole": "示范方法", "learningGap": "原文用3和−4.8表示实物位置，需连起正负号、距离和汽车站这三个信息。", "learningAction": "能把表示物体位置的数读成车站哪一侧、离站多远。", "related": []}, {"id": "ch1-thermometer-think", "locationId": "ch1-thermometer-think", "title": "思考：温度计与数值直线的共同点", "preview": "比较两幅图时，看表示数的共同规则，不只看横着还是竖着。", "paragraphs": [], "learningRole": "探究", "learningGap": "比较两幅图时，看表示数的共同规则，不只看横着还是竖着。", "learningAction": "能从表示规则而非外观归纳温度计与数值直线的共同点。", "related": [{"locationId": "ch1-source-number-line-definition", "label": "数轴的原文定义", "purpose": "回看原点、正方向和单位长度的要求，再读本题图形。"}], "questionGuide": {"knowledgePoints": ["图1.2-2以汽车站所在点表示0，正负数分别表示它两侧的位置，刻度用同一种长度尺度。", "图1.2-3的温度计也标有正数、0和负数；比较两图时，可逐项查看0的位置、正负数所在方向和相邻刻度间隔。"], "method": ["比较两图中某个数对应的位置：换一个数后，这种对应规则还成立吗？从图中找依据说明哪些表示规则相同。"], "cautions": ["外形、摆放方向和生活用途不同，不妨碍它们采用相同的表示规则；不要把温度单位与道路长度单位说成相同。"]}}, {"id": "ch1-number-line-origin", "locationId": "ch1-number-line-origin", "title": "原点可以任选，选定后为什么不能随便换？", "preview": "“任取”说的是开始建立数轴时的自由。", "paragraphs": ["一条直线本来没有哪个点天生代表0。建立数轴时，可以挑一个方便的点作为原点；这就是“任取”的含义。", "一旦开始表示和读取数，所有点都以这个原点为参照。若中途把别处改成0，各点的数值就必须重新确定，不能沿用旧标签。这和测量长度时要先对齐起点是同一个道理。"], "learningRole": "定义概念", "learningGap": "原点规定里的任取容易被读成读数过程中也可随意改动，需要区分建立约定与使用约定。", "learningAction": "能说明原点开始时可选而使用过程中必须固定，并判断改变原点会影响数值。", "related": []}, {"id": "ch1-number-line-direction", "locationId": "ch1-number-line-direction", "title": "正方向是约定，箭头不是装饰", "preview": "先确认正方向，才能把“在哪一边”读成正数或负数。", "paragraphs": ["教材说“通常”向右或向上为正方向，这是为了让大家按共同习惯读图。直线画成横的或竖的，并不决定数的本质；图上选定的正方向才决定从原点往哪边表示正数。", "沿用本书的通常约定画数轴时，要把正方向标清，再保持整个图一致。不能在同一张图中一会儿按向右为正、一会儿又按向左为正来读取点。"], "learningRole": "定义概念", "learningGap": "原文列出通常的方向约定，但未解释方向标记对读数的一致性作用。", "learningAction": "能依据数轴的正方向判断点的符号，并保持同一图中的方向约定一致。", "related": []}, {"id": "ch1-number-line-unit", "locationId": "ch1-number-line-unit", "title": "单位长度能选，为什么不能一格长一格短？", "preview": "一次选定的“1”必须在这条数轴上重复使用。", "paragraphs": ["“选取适当的长度”让你按纸面大小选定画多长表示1。选好后，每一个单位长度都要相等，否则同样长的一段路会在不同位置表示不同的数值，图上的距离就失去了统一尺度。", "相邻写出的数字不一定相差1。补充用例：若只标0、2、4，每两个相邻标签之间应有两个单位长度；单位长度由数值差和图上距离共同确定，不能只数写了几个标签。"], "learningRole": "定义概念；示范方法", "learningGap": "单位长度规定未展开同轴等距的理由，以及单位长度与相邻已写标签间隔的区别。", "learningAction": "能检查单位长度是否一致，并在不连续标数的数轴上辨认一个单位长度。", "related": []}, {"id": "ch1-number-line", "locationId": "ch1-number-line", "title": "三个要素各管一件事", "preview": "原点定参照，正方向定朝向，单位长度定尺度。", "paragraphs": ["原点告诉我们从哪里起算，正方向告诉我们往哪边表示正数，单位长度告诉我们走多远表示1。三个约定一起确定后，点的位置才能对应到确定的数。", "例如，只看一个点在原点右边，还不能读出它是2还是3；这还要检查单位长度。看图读数时，可以依次问“从哪里量、往哪边、量了几个单位”，而不凭点在纸上的大概位置猜数。"], "learningRole": "定义概念", "learningGap": "需把原点、正方向和单位长度分别与一个点的读数联系起来。", "learningAction": "能分别说出三要素的作用，并用三个约定检查一个点的读数。", "related": [{"locationId": "ch1-number-line-origin", "label": "原点：固定参照位置", "purpose": "确认任选原点与使用时保持原点不变的区别。"}, {"locationId": "ch1-number-line-unit", "label": "单位长度：固定读数尺度", "purpose": "检查图上的一段长度究竟代表几个单位。"}]}, {"id": "ch1-number-line-distance", "locationId": "ch1-number-line-distance", "title": "表示−a的点，距离为什么仍是a？", "preview": "这里先规定a为正数；负号负责方向，距离不用负数记录。", "paragraphs": ["“设a是一个正数”先确定a可以表示正的距离数。点表示−a，说明它在负半轴；与原点相距a个单位长度，说明它离原点有多远。这两句话分别描述方向和距离。", "补充用例：点表示−2，意思是向负方向离开原点2个单位长度，不能把它到原点的距离写成−2。只给出距离2还不能选定一个点，因为正方向也有离原点同样远的位置。"], "learningRole": "陈述性质或结论", "learningGap": "归纳把点的数值与距离相邻书写，需要拆开负号决定方向、正数a决定距离及仅有距离不能唯一定位。", "learningAction": "能区分点表示的数与到原点的距离，并解释仅给正距离还缺方向。", "related": [{"locationId": "ch1-opposite-geometry", "label": "继续看同样远的两个点", "purpose": "查看距离确定而方向不同的两个位置怎样成对出现。"}]}, {"id": "ch1-example-1-2-2-guide", "locationId": "ch1-example-1-2-2-guide", "title": "1.2例2：在数轴上表示数", "preview": "数轴上的位置需要哪些约定才能确定？", "paragraphs": [], "learningRole": "示范方法", "learningGap": "画出完整数轴后，正负决定方向，距离决定落点。", "learningAction": "能在尺度一致的数轴上表示整数、分数、小数与0。", "related": [{"locationId": "ch1-source-number-line-definition", "label": "数轴的原文定义", "purpose": "回看原点、正方向和单位长度的要求，再读本题图形。"}, {"locationId": "ch1-number-line-fraction", "label": "分数点的位置", "purpose": "回看等分一个单位长度的定位依据。"}], "questionGuide": {"knowledgePoints": ["规定了原点、正方向和单位长度的直线叫数轴；0对应原点，正数和负数分别在正半轴和负半轴。", "标正数时，从原点沿正方向量出相应距离；标负数时，沿负方向量出去掉负号后的数所给的距离。分数和小数也使用同一单位长度。"], "method": ["例2中既有整数，也有非整数和0。哪些位置能直接利用整数刻度，哪些还需要把单位长度细分？", "对照教材图，说明你如何核对一个点的位置与它所标的数一致；不凭点在纸上的大概位置判断。"], "cautions": ["不能把分数就近挪到整数刻度；同一条数轴只用一种尺度，点的标签要能与点一一对应。"]}}, {"id": "ch1-number-line-fraction", "locationId": "ch1-number-line-fraction", "title": "分数对应的点，不必落在整数刻度上", "preview": "把一个单位长度再等分，就能确定分数的位置。", "paragraphs": ["图上的整数刻度只是帮助定位，刻度之间也有点可以表示数。例2中的−5/2，先把5/2读成2.5个单位长度，再按负号从原点向负方向定位。", "定位分数时，可以按分母把一个单位长度等分。分母为2时，一个单位分成相等的两半；不能因为数轴只写了整数刻度，就把这个数挪到最近的整数点上。"], "learningRole": "示范方法", "learningGap": "例2直接画出分数点，未解释如何通过等分单位长度从数值确定非整数点位。", "learningAction": "能用单位长度的等分解释分数点的位置，并保留分数与邻近整数的区别。", "related": [{"locationId": "ch1-number-line-unit", "label": "回顾单位长度", "purpose": "先确定完整的一单位，再作等分。"}]}, {"id": "ch1-practice-p11-1", "locationId": "ch1-practice-p11-1", "title": "练习第1题", "preview": "字母是点的名称，不是数值。", "paragraphs": [], "learningRole": "练习", "learningGap": "先把字母与它下方的点对准，再读取对应刻度。", "learningAction": "能将五个字母点准确对应到数轴刻度。", "related": [{"locationId": "ch1-source-number-line-definition", "label": "数轴的原文定义", "purpose": "回看原点、正方向和单位长度的要求，再读本题图形。"}], "questionGuide": {"knowledgePoints": ["本题图中，0对应原点，右侧表示正数，左侧表示负数；数值要按图中同一个单位长度读取。", "字母标的是点，需读取该点所对的刻度；点落在两个整数刻度之间时，不能移到邻近整数上。"], "method": ["先核对原点、正方向和单位长度，再分别追踪每个字母所标的点，读取该点而非旁边点的刻度。"], "cautions": ["题目列字母的顺序不等于图上从左到右的顺序；非整数刻度也有对应点，不能只读整数标签。"]}}, {"id": "ch1-practice-p11-2", "locationId": "ch1-practice-p11-2", "title": "练习第2题", "preview": "整数、分数与小数要在同一条数轴上表示。", "paragraphs": [], "learningRole": "练习", "learningGap": "整数与半单位的数共用同一尺度，先把单位长度选得便于等分。", "learningAction": "能选用适当尺度并自主标出所有给定有理数。", "related": [{"locationId": "ch1-number-line-unit", "label": "单位长度的一致性", "purpose": "先确定一单位再作等分。"}, {"locationId": "ch1-number-line-distance", "label": "符号和距离", "purpose": "检查负分数的方向与距离。"}], "questionGuide": {"knowledgePoints": ["数轴要先规定原点、正方向和单位长度；分数、小数和整数必须使用同一尺度。", "按课本向右为正的画法，正数在原点右侧，负数在左侧；从原点量出的单位长度数，由这个数不带正负号的数值确定。"], "method": ["所给分数和小数在整数刻度之间的哪一类位置？怎样选单位长度，能让这些位置清楚可辨？", "画好后，用每个点所在的方向和到原点的距离核对所标的数，再与原列表检查有无遗漏。"], "cautions": ["负分数的位置由负方向和正的距离共同确定；不要把所有分数都放到0与1之间，或每标一个数就另换尺度。"]}}, {"id": "ch1-practice-p11-3", "locationId": "ch1-practice-p11-3", "title": "练习第3题", "preview": "“包括这两个点”限制了本题的计数范围。", "paragraphs": [], "learningRole": "练习", "learningGap": "这次明确包含两端；计数前还要筛出表示整数的点。", "learningAction": "能结合包含端点与整数条件列数，并分别完成两次计数。", "related": [{"locationId": "ch1-source-number-line-definition", "label": "数轴的原文定义", "purpose": "回看原点、正方向和单位长度的要求，再读本题图形。"}, {"locationId": "ch1-source-positive-negative", "label": "正数、负数与0的规定", "purpose": "回看教材对正数、负数和0的规定，再判断本题中的数。"}], "questionGuide": {"knowledgePoints": ["整数包括正整数、0和负整数；在数轴上，相邻两个整数点相隔一个单位长度。", "本题写明“包括这两个点”，因此查找时要检查两端的点；点的个数与相邻单位长度小段的条数不同。"], "method": ["三个空格所数的对象分别是什么？可借助整数点列表或数轴检查，避免把点的个数当成单位长度段数。", "你采用的记录怎样表明端点已计入、哪些点属于负整数？"], "cautions": ["题目数的是点，不是单位长度小段；三个空格分别问总个数、具体整数及负整数个数，要区分。"]}}, {"id": "ch1-number-line-move", "locationId": "ch1-number-line-move", "title": "练习第4题", "preview": "给定距离能否唯一确定终点？", "paragraphs": ["题目给了出发点和移动的单位数，但“向某一方向”没有指定向正方向还是负方向。距离只说明走多远，本身不会替你选定方向。", "移动的单位数是在比较终点与出发点的距离，不是终点所表示的数。出发点不在原点时，这两个数尤其容易混淆。"], "learningRole": "练习", "learningGap": "“某个方向”没有选定朝向，需要检查可能的移动情形。", "learningAction": "能识别未定方向并自主检查各可能终点。", "related": [{"locationId": "ch1-number-line-distance", "label": "点表示的数与距离", "purpose": "确认距离本身并未包含方向信息。"}], "questionGuide": {"knowledgePoints": ["数轴上从同一个起点可以向左或向右移动；移动距离说明走多远，方向说明走向哪一侧。", "本题从整数点出发，每移动一个单位长度，就到达相邻整数点；“某一方向”没有预先指定向左或向右。"], "method": ["怎样说明你找到的终点都符合题意，且没有遗漏？可以借助数轴，用起点、方向和距离三个条件检查自己的判断。"], "cautions": ["正的距离值不等于已指定正方向；4个单位长度说的是从A出发走多远，不是终点必须表示4。"]}}, {"id": "ch1-opposite-inquiry", "locationId": "ch1-opposite-inquiry", "title": "1.2.3探究：与原点等距的点", "preview": "相同的距离能确定哪些位置关系？", "paragraphs": [], "learningRole": "探究", "learningGap": "只给到原点的距离时，要在两侧都检查，再比较所得数的关系。", "learningAction": "能对两种距离条件完整找点，并自主归纳其位置与数值关系。", "related": [{"locationId": "ch1-number-line-distance", "label": "方向与距离分别说明什么", "purpose": "用距离条件寻找全部候选位置。"}, {"locationId": "ch1-number-line-fraction", "label": "半单位的定位", "purpose": "用等分单位长度处理第二个距离条件。"}], "questionGuide": {"knowledgePoints": ["数轴的原点表示0；正、负方向在原点两侧，比较远近时都要使用同一个单位长度。", "正整数和正分数都能表示到原点的距离；按给定距离找点时，要检查原点两侧，而不只查看正方向。"], "method": ["数轴上满足一个距离条件的点是否找全，可以用什么特征检查？分别针对距离3和1/2作观察。", "对照两次观察，用数的写法和图上位置说明你的发现；规律应由观察支持，不只凭一正一负猜测。"], "cautions": ["不能只在正半轴找点；两个数一正一负还不足以说明本探究中的关系，要核对它们到原点是否同样远。"]}}, {"id": "ch1-opposite-geometry", "locationId": "ch1-opposite-geometry", "title": "“距离相等的两个点”为什么要限定a为正数？", "preview": "距离大于0时，才能在原点两侧各找到一个点。", "paragraphs": ["从原点向两侧各走a个单位长度，就得到两个不同的点。它们与原点同样远，方向相反，因此一个表示a，另一个表示−a；这也说明两点关于原点对称。", "条件“a是一个正数”不能省略。若距离是0，两侧的出发位置都还是原点，不会出现两个不同的点。若只说两个数一正一负，也还不够：它们还必须到原点同样远，才符合这段归纳描述的成对关系。"], "learningRole": "推导或证明；陈述性质或结论", "learningGap": "归纳说明两个等距点，但需解释正距离条件保证两点不同，以及异号还须配合同距。", "learningAction": "能说明a>0对两个不同点的作用，并用异侧且同距检查这一成对关系。", "related": [{"locationId": "ch1-number-line-distance", "label": "回顾数值、方向和距离", "purpose": "用前一段的距离解释核对a与−a为何在两侧。"}]}, {"id": "ch1-opposite-pair", "locationId": "ch1-opposite-pair", "title": "相反数说的是两个数的关系", "preview": "符号相反还不够，所表示的大小部分也要相同。", "paragraphs": ["“互为”说明这是两个数之间的关系。说一个数的相反数时，要知道它与哪个数配成一对，不能把“相反数”当成像“负数”那样只看一个数就能判断的名称。", "除0外，一对相反数不但符号相反，在数轴上到原点的距离也相同。补充用例：2和−5虽然一正一负，却不是相反数，因为它们离原点的距离不同。"], "learningRole": "定义概念", "learningGap": "“互为”与“只有符号不同”两个关键词未展开，容易把任意正数与负数配成相反数。", "learningAction": "能说清相反数描述两个数的关系，并用距离条件排除仅符号相反的数对。", "related": [{"locationId": "ch1-opposite-geometry", "label": "回看相反数的数轴位置", "purpose": "用两点到原点的距离检查“只有符号不同”这一条件。"}]}, {"id": "ch1-opposite-zero", "locationId": "ch1-opposite-zero", "title": "为什么0的相反数还是0？", "preview": "原点关于自身对称后，位置不变。", "paragraphs": ["取相反数可以看成找关于原点对称的位置。0就在原点上，把它放到关于原点对称的位置，仍然是原点，所以结果还是0。", "如果一个点不在原点，对称后的点就会落在原点另一侧，两个位置不同。因此，0也是唯一与自己的相反数相等的数。"], "learningRole": "陈述性质或结论；推导或证明", "learningGap": "教材直接陈述0的相反数，未说明为何0是取相反数后位置不变的例外。", "learningAction": "能用数轴解释0的相反数是0，并说明其他数为什么不具备这一特点。", "related": [{"locationId": "ch1-opposite-geometry", "label": "从对称位置理解相反数", "purpose": "把一般位置与原点这个特殊位置作对照。"}]}, {"id": "ch1-q-opposite-sign", "locationId": "ch1-q-opposite-sign", "title": "相反数旁注思考：−a一定是负数吗", "preview": "字母取值没有确定时，先检查负号表示什么。", "paragraphs": [], "learningRole": "探究", "learningGap": "字母取值没有确定时，先检查负号表示什么。", "learningAction": "能覆盖a的三种符号情况，判断含“一定”的表述并给出数轴理由。", "related": [{"locationId": "ch1-source-opposite-minus", "label": "在一个数前添负号的规定", "purpose": "回看“添上负号”表示取相反数的原文，先认清负号作用于哪个数。"}, {"locationId": "ch1-opposite-geometry", "label": "相反数在数轴上的位置", "purpose": "用关于原点的位置关系辨认和检查相反数。"}], "questionGuide": {"knowledgePoints": ["在一个数前添上“−”号，表示取这个数的相反数；−a要读作“a的相反数”。", "教材中的a可以表示正数、负数或0，不能只凭写在a前面的负号判断整个式子的正负。"], "method": ["把−a读作“a的相反数”，再分别考虑a位于原点右侧、左侧和原点时会发生什么。", "可以先用不同类别的数试验，再用数轴位置解释自己的判断。"], "cautions": ["“一定”要求对所有允许的a成立，不能只取一个正数就下结论。", "要区分取相反数这个操作与所得数的正负；判断它们分别需要哪些信息？"]}}, {"id": "ch1-opposite-sign", "locationId": "ch1-opposite-sign", "title": "−a 中的“−”表示什么？", "preview": "它表示取 a 的相反数；结果的正负还要看 a。", "paragraphs": ["在 −a 中，“−”表示取 a 的相反数，不是在宣布结果一定为负。判断 −a 的正负前，要先知道 a 在数轴的哪一侧。", "补充用例：若 a=−2，则 −a=−(−2)=2。用数轴看，就是把表示 a 的点移到原点另一侧、距离相同的位置。若 a=0，这个位置仍是原点。"], "learningRole": "定义概念", "learningGap": "教材提出“−a一定是负数吗”，但没有展开字母前的负号与结果正负之间的区别。", "learningAction": "能依据 a 的取值判断 −a 的正负，并用数轴解释。", "related": [{"locationId": "ch1-opposite-geometry", "label": "数轴上的相反数", "purpose": "回看关于原点的对称位置，解释为何取相反数不等于得到负数。"}]}, {"id": "ch1-q-opposite-geometry", "locationId": "ch1-q-opposite-geometry", "title": "相反数旁注思考：说明−(−5)=+5", "preview": "用数轴解释括号内外两层符号的作用。", "paragraphs": [], "learningRole": "探究", "learningGap": "用数轴解释括号内外两层符号的作用。", "learningAction": "能把内外两层符号转成数轴位置操作，解释给定等式。", "related": [{"locationId": "ch1-source-opposite-minus", "label": "在一个数前添负号的规定", "purpose": "回看“添上负号”表示取相反数的原文，先认清负号作用于哪个数。"}, {"locationId": "ch1-opposite-geometry", "label": "相反数在数轴上的位置", "purpose": "用关于原点的位置关系辨认和检查相反数。"}], "questionGuide": {"knowledgePoints": ["非零的两个相反数在原点两侧，离原点同样远；取相反数时，距离不变，方向相反。", "括号把其中的数看作整体；括号外添上“−”号，表示取这个整体的相反数。"], "method": ["先在数轴上确认括号内的数所对应的点，再说明外面的负号要求找什么位置。", "用两点相对原点的方向和距离说明等式，不只写“两个负号消掉”。"], "cautions": ["外层负号作用于括号中的整个数。", "这道题要求数轴理由，仅写化简结果还没有完成说明。"]}}, {"id": "ch1-opposite-twice", "locationId": "ch1-opposite-twice", "title": "−(−5)为什么表示正数？", "preview": "外面的“−”对括号里的整个数取相反数。", "paragraphs": ["读−(−5)时，先把括号里的−5看成一个完整的数，再读外面的“−”：它要求取−5的相反数。判断结果的正负，要看这个操作得到哪个数。", "从数轴看，−5的点在原点左侧，取相反数后到达右侧相同距离的位置。更一般地，对一个数连续取两次相反数，就回到原来的位置；0也符合这个结论。"], "learningRole": "示范方法；推导或证明", "learningGap": "符号化简已有结果，但外层负号作用于整体以及连续取相反数的位置意义尚未展开。", "learningAction": "能按括号内外解释−(−5)，并用位置变化说明连续取两次相反数回到原数。", "related": [{"locationId": "ch1-source-opposite-minus", "label": "在一个数前添负号的规定", "purpose": "回看“添上负号”表示取相反数的原文，先认清负号作用于哪个数。"}]}, {"id": "ch1-q-example-3", "locationId": "ch1-q-example-3", "title": "例3", "preview": "分别识别“求相反数”和“已知相反数反求原数”。", "paragraphs": [], "learningRole": "示范方法", "learningGap": "分别识别“求相反数”和“已知相反数反求原数”。", "learningAction": "能分别说明求相反数与反求原数的依据，并用互反关系检查。", "related": [{"locationId": "ch1-source-opposite-definition", "label": "相反数的原文定义", "purpose": "确认两个数怎样才互为相反数，并检查0的情形。"}, {"locationId": "ch1-opposite-inverse-example", "label": "反求原数的依据", "purpose": "检查例3（2）如何使用“互为”关系。"}], "questionGuide": {"knowledgePoints": ["只有符号不同的两个数互为相反数；求相反数适用于整数、分数和小数。", "教材用3和−3说明：“3的相反数是−3，−3的相反数是3。”已知谁是谁的相反数，也就知道反过来的对应关系。"], "method": ["（1）检查每个给定数的符号和到原点的距离，再确定与它配对的数。", "（2）先说清已知数与a的关系，利用“互为”判断反求原数能使用什么方法。", "把得到的数再取相反数，可检查是否回到已知数。"], "cautions": ["求相反数改变方向，不改变到原点的距离。", "不要因为（2）给出了一个数，就把它直接当成a。"]}}, {"id": "ch1-opposite-inverse-example", "locationId": "ch1-opposite-inverse-example", "title": "知道相反数，怎样找回原数？", "preview": "“互为”允许把这对数反过来读。", "paragraphs": ["这一问给的是a的相反数，要求找a。因为相反数是相互的，既然给出的数是a的相反数，a也就是给出的数的相反数。这里反过来使用了定义中的“互为”。", "核对时，可以从找到的数出发再取一次相反数，看能否回到题目给的数。这与直接抄下已知数不同：要找的是和它配对的另一个数。"], "learningRole": "示范方法", "learningGap": "例3（2）直接给出a的值，未拆开“已知相反数反求原数”为何仍用同一方法。", "learningAction": "能说明反求原数所用的互反关系，并用再次取相反数检查结果。", "related": [{"locationId": "ch1-source-opposite-definition", "label": "相反数的原文定义", "purpose": "确认两个数怎样才互为相反数，并检查0的情形。"}]}, {"id": "ch1-q-opposite-practice-1", "locationId": "ch1-q-opposite-practice-1", "title": "1.2.3练习第1题", "preview": "逐句检查是否说清对象、配对条件和取值范围。", "paragraphs": [], "learningRole": "练习", "learningGap": "逐句检查是否说清对象、配对条件和取值范围。", "learningAction": "能逐句检查对象、配对条件及全称范围，并自主判定六句话。", "related": [{"locationId": "ch1-source-opposite-definition", "label": "相反数的原文定义", "purpose": "确认两个数怎样才互为相反数，并检查0的情形。"}, {"locationId": "ch1-opposite-geometry", "label": "相反数在数轴上的位置", "purpose": "用关于原点的位置关系辨认和检查相反数。"}], "questionGuide": {"knowledgePoints": ["“互为相反数”说的是两个数的关系；只有符号不同的两个数互为相反数，0的相反数是0。", "“互为”同时说明两个方向的对应；只知道一正一负，还需核对它们除符号外是否相同。"], "method": ["六句话分别是在说一个数的类别、两个数的关系，还是对所有数作断言？按句子的对象选择定义核对。", "若认为某句话不成立，说明缺少的条件或给出反例；若认为成立，说明为什么允许的情况都符合定义。"], "cautions": ["判断含“任何”“正数和负数”等一般表述时，要检查全部允许的情况。", "不成立的句子可用反例或缺少的条件说明，不能只凭读起来熟悉。"]}}, {"id": "ch1-q-opposite-practice-2", "locationId": "ch1-q-opposite-practice-2", "title": "1.2.3练习第2题", "preview": "整数、分数、小数都可以按相反数定义检查。", "paragraphs": [], "learningRole": "练习", "learningGap": "对每个给定数保留距离，检查相反的方向。", "learningAction": "能依据统一定义写出八个整数、分数和小数的相反数。", "related": [{"locationId": "ch1-source-opposite-definition", "label": "相反数的原文定义", "purpose": "确认两个数怎样才互为相反数，并检查0的情形。"}], "questionGuide": {"knowledgePoints": ["非零的两个相反数只有符号不同：正数与负数配对，到原点的距离不变；分数和小数也遵守这一条件。"], "method": ["相反数定义对一对数提出什么要求？对每个给定数，说明你写出的数满足了哪些条件。", "可任选一对用数轴复核，再检查八个数是否均有对应记录。"], "cautions": ["分母、数字大小和小数位不因求相反数而改变。", "正数省略正号后仍是正数；不能因没有符号而漏掉处理。"]}}, {"id": "ch1-q-opposite-practice-3", "locationId": "ch1-q-opposite-practice-3", "title": "1.2.3练习第3题", "preview": "a=−a同时限制数值与图上的位置关系。", "paragraphs": [], "learningRole": "练习", "learningGap": "把数相等的条件，转换为数轴上的点重合。", "learningAction": "能将a=−a转成点重合条件，自主确定并说明符合的数轴位置。", "related": [{"locationId": "ch1-opposite-geometry", "label": "相反数在数轴上的位置", "purpose": "用关于原点的位置关系辨认和检查相反数。"}, {"locationId": "ch1-source-number-line-definition", "label": "数轴的原文定义", "purpose": "回看原点、正方向和单位长度的要求，再读本题图形。"}], "questionGuide": {"knowledgePoints": ["a和−a互为相反数；非零时，它们的点分居原点两侧，到原点距离相等。", "两个数相等时，它们在同一条数轴上对应同一个点；题目要求这个位置同时符合相反数的关系。"], "method": ["分别想象a的点与−a的点应怎样对应，再检查a=−a要求这两个点具有什么关系。", "用一个满足两种位置要求的草图说明判断，而不只尝试几个数。"], "cautions": ["题目问的是点的位置，作答时需要说明它相对原点在哪里。", "a尚未给定，不能先假定a是正数或负数。"]}}, {"id": "ch1-q-opposite-practice-4", "locationId": "ch1-q-opposite-practice-4", "title": "1.2.3练习第4题", "preview": "括号内的数与括号外的符号各表示什么？", "paragraphs": [], "learningRole": "练习", "learningGap": "先识别括号里的数，再处理括号外的负号。", "learningAction": "能按括号内外的符号作用独立化简四个式子。", "related": [{"locationId": "ch1-source-opposite-minus", "label": "在一个数前添负号的规定", "purpose": "回看“添上负号”表示取相反数的原文，先认清负号作用于哪个数。"}, {"locationId": "ch1-source-opposite-definition", "label": "相反数的原文定义", "purpose": "确认两个数怎样才互为相反数，并检查0的情形。"}], "questionGuide": {"knowledgePoints": ["在一个数前添上“−”号，表示取这个数的相反数；括号内的整个数是这个负号作用的对象。", "非零的两个相反数只有符号不同，除符号外的分数或小数数值不变。"], "method": ["对四个式子分别确认括号内完整的数，再说明最外层负号对它做什么。", "按原数与结果是否互为相反数检查，不必把整数与小数分成两套规则。"], "cautions": ["不要把最左边的负号直接当成结果的符号。", "取相反数不改变数字部分，小数点和分数线的位置也不变。"]}}, {"id": "ch1-q-absolute-intro", "locationId": "ch1-q-absolute-intro", "title": "绝对值引入问题", "preview": "比较一对相反数在数轴上相同与不同的信息。", "paragraphs": [], "learningRole": "探究", "learningGap": "比较一对相反数在数轴上相同与不同的信息。", "learningAction": "能将相反数中相同的大小部分与数轴上的可比较特征对应。", "related": [{"locationId": "ch1-opposite-geometry", "label": "相反数在数轴上的位置", "purpose": "用关于原点的位置关系辨认和检查相反数。"}], "questionGuide": {"knowledgePoints": ["非零的两个相反数只有符号不同；在数轴上，它们分居原点两侧，到原点的距离相等。"], "method": ["图1.2-7中，两段蓝色箭头分别标出原点O到A、O到B的距离，都标为10。观察两个数的共同部分，并用这两个距离标记说明它在图中的意义。"], "cautions": ["原文已限定“除0以外”，观察时要保留这一条件。", "解释时要把所选的图上特征与“相同部分”对应起来，不能只重复两个数互为相反数。"]}}, {"id": "ch1-absolute-definition", "locationId": "ch1-absolute-definition", "title": "绝对值保留了什么信息？", "preview": "它保留离原点的远近，不保留在原点哪一侧。", "paragraphs": ["一个数在数轴上的位置，既有“在原点哪一侧”的信息，也有“离原点多远”的信息。求绝对值时，只读出后者，所以结果不能小于0。", "教材中的10和−10位置不同，距离却相同。这说明知道绝对值，不一定就能知道原数；还要留意有没有给出正负等其他条件。绝对值符号是在要求求距离，不是一个可以随意删掉的外框。"], "learningRole": "定义概念", "learningGap": "定义给出了距离含义，但未说明从数到绝对值时保留距离、舍去方向所造成的信息变化。", "learningAction": "能说明两个不同的数为何可能有相同的绝对值，并区分原数与表示距离的数。", "related": [{"locationId": "ch1-opposite-geometry", "label": "相反数与原点的距离", "purpose": "从相反数的位置关系看出距离相等不代表数相等。"}]}, {"id": "ch1-absolute-zero", "locationId": "ch1-absolute-zero", "title": "绝对值能不能等于0？", "preview": "距离可以为0，但只有原点到原点的距离为0。", "paragraphs": ["绝对值表示距离，距离可以等于0：当表示这个数的点恰好在原点时，两点重合，距离就是0。因此应说绝对值“不小于0”，不能说所有数的绝对值都“大于0”。", "反过来，如果一个数的绝对值等于0，它的点到原点没有距离，只能与原点重合。于是，不仅0的绝对值是0，绝对值为0的数也只有0。"], "learningRole": "陈述性质或结论；推导或证明", "learningGap": "教材只直接陈述|0|=0，尚未展开非负与正的边界以及距离为0的唯一性。", "learningAction": "能区分绝对值为正与非负，并说明绝对值等于0时原数为什么只能是0。", "related": [{"locationId": "ch1-source-absolute-definition", "label": "绝对值的距离定义", "purpose": "把绝对值读成点到原点的距离，再判断本题要用到哪部分信息。"}]}, {"id": "ch1-q-absolute-inquiry", "locationId": "ch1-q-absolute-inquiry", "title": "绝对值探究", "preview": "取例要覆盖不同符号，猜想还要回到距离定义检验。", "paragraphs": [], "learningRole": "探究", "learningGap": "取例要覆盖不同符号，猜想还要回到距离定义检验。", "learningAction": "能选取覆盖不同符号的数提出猜想，再用距离定义解释规律。", "related": [{"locationId": "ch1-source-absolute-definition", "label": "绝对值的距离定义", "purpose": "把绝对值读成点到原点的距离，再判断本题要用到哪部分信息。"}, {"locationId": "ch1-source-opposite-minus", "label": "在一个数前添负号的规定", "purpose": "回看“添上负号”表示取相反数的原文，先认清负号作用于哪个数。"}], "questionGuide": {"knowledgePoints": ["数a的绝对值，是数轴上表示a的点到原点的距离，记作|a|。", "按图中向右为正的画法，正数、负数和0分别在原点右侧、左侧和原点；每类都要选数，比较原数与距离的关系。"], "method": ["选取不同类别的数，分别记录原数和它到原点的距离。", "比较每类中绝对值与原数的关系，再检查自己提出的规律能否由距离定义解释。"], "cautions": ["只取正数试验，不能得到关于所有数的结论。", "写含字母的规律时，应同时写出字母满足的条件。"]}}, {"id": "ch1-absolute-negative", "locationId": "ch1-absolute-negative", "title": "为什么负数的绝对值写成 −a？", "preview": "当 a 为负数时，−a 才表示那个正的距离。", "paragraphs": ["绝对值表示距离，结果不能小于 0。这里先给出了 a 是负数这一条件，−a 是这个负数的相反数，因而是正数；式子右侧出现“−”不代表距离为负。", "补充用例：取 a=−2，则 |a|=2，−a=2。若 a 是正数，−a 就是负数，不能拿它表示这段距离。因此使用 |a|=−a 时，要核对 a 的符号；a=0 时两边也都为 0。"], "learningRole": "陈述性质或结论", "learningGap": "负数绝对值公式右边的负号容易被理解成负的距离，需解释条件如何决定 −a 的值。", "learningAction": "能说明 a 为负数时 |a|=−a 的理由，并检查公式适用条件。", "related": [{"locationId": "ch1-source-opposite-minus", "label": "在一个数前添负号的规定", "purpose": "回看“添上负号”表示取相反数的原文，先认清负号作用于哪个数。"}, {"locationId": "ch1-source-absolute-definition", "label": "绝对值的距离定义", "purpose": "把绝对值读成点到原点的距离，再判断本题要用到哪部分信息。"}]}, {"id": "ch1-q-example-4", "locationId": "ch1-q-example-4", "title": "例4" graphs": ["这两个写法里都出现了负号，但它们最外层的操作不同：一个是取相反数，一个是求绝对值。只有先弄清整个式子表示的数，才能判断应使用正数、负数还是异号数的比较方法。", "这里化简的目的，是确认比较规则的条件。不能看见式子中有“−”就套用“两个负数，绝对值大的反而小”；那条规则要求比较的两个数本身都是负数。"], "learningRole": "示范方法", "learningGap": "例5（4）写出了“先化简”及数值，未说明先化简是为了确认整式的正负并选择比较规则。", "learningAction": "能解释先化简的目的，并按化简后数的符号检查大小比较规则的条件。", "related": [{"locationId": "ch1-source-opposite-minus", "label": "在一个数前添负号的规定", "purpose": "回看“添上负号”表示取相反数的原文，先认清负号作用于哪个数。"}, {"locationId": "ch1-source-absolute-definition", "label": "绝对值的距离定义", "purpose": "把绝对值读成点到原点的距离，再判断本题要用到哪部分信息。"}, {"locationId": "ch1-source-comparison-rules", "label": "有理数大小比较的规则", "purpose": "回看正数、0、负数之间及两个负数的比较条件，再选择本题需要的规则。"}]}, {"id": "ch1-q-order-practice-1", "locationId": "ch1-q-order-practice-1", "title": "1.2.5练习第1题", "preview": "同号、异号与带有多层符号的比较，条件各有不同。", "paragraphs": [], "learningRole": "练习", "learningGap": "先看整式正负，再处理距离和分数比较。", "learningAction": "能按符号、嵌套操作及分数表示选择比较方法，独立完成六组比较。", "related": [{"locationId": "ch1-source-absolute-rule", "label": "正数、负数和0的绝对值求法", "purpose": "先按课本的三种情况选择求法，再计算本题的数。"}, {"locationId": "ch1-order-on-axis", "label": "数轴上从左到右、从小到大的规定", "purpose": "回到教材的大小顺序规定，再按本题要求比较或排列。"}, {"locationId": "ch1-source-comparison-rules", "label": "有理数大小比较的规则", "purpose": "回看正数、0、负数之间及两个负数的比较条件，再选择本题需要的规则。"}, {"locationId": "ch1-source-opposite-minus", "label": "在一个数前添负号的规定", "purpose": "回看“添上负号”表示取相反数的原文，先认清负号作用于哪个数。"}, {"locationId": "ch1-source-absolute-definition", "label": "绝对值的距离定义", "purpose": "把绝对值读成点到原点的距离，再判断本题要用到哪部分信息。"}], "questionGuide": {"knowledgePoints": ["正数大于负数；两个负数中，绝对值大的反而小，负分数、负小数也适用。", "绝对值表示到原点的距离，数前添“−”号表示取相反数；竖线或括号外的符号仍要作用于里面的整个数。"], "method": ["（1）（2）对照异号与同为负数时，需要依据哪些不同信息。", "（3）（5）（6）先辨明括号或绝对值内外的操作，确定实际比较的对象。", "（4）比较负分数时，可先选用已学的分数比较方法处理距离，再检查如何回到原数。"], "cautions": ["绝对值外的负号仍须保留其作用。", "（6）涉及有限小数与分数，不能用随意截取的小数近似值代替精确比较。"]}}, {"id": "ch1-q-order-practice-2", "locationId": "ch1-q-order-practice-2", "title": "1.2.5练习第2题", "preview": "两组数的表示方式不同，排序都需检查整体次序。", "paragraphs": [], "learningRole": "练习", "learning ": [{"locationId": "ch1-source-number-line-definition", "label": "数轴的原文定义", "purpose": "回看原点、正方向和单位长度的要求，再读本题图形。"}, {"locationId": "ch1-number-line-fraction", "label": "分数在数轴上的位置", "purpose": "检查非整数的点在相邻整数刻度之间怎样定位。"}, {"locationId": "ch1-opposite-geometry", "label": "相反数在数轴上的位置", "purpose": "用关于原点的位置关系辨认和检查相反数。"}], "questionGuide": {"knowledgePoints": ["数轴规定原点、正方向和单位长度；所有数都要用同一个单位长度表示，整数之间还可以细分。", "正数向原点右侧定位，负数向左侧定位；带分数的负号作用于整个数，定位时要量出完整距离。"], "method": ["选择的单位长度能否准确表示题中的半单位和五分之一单位？检查八个数需要的左右范围。", "描点后，用整数刻度和相反数的位置关系检查点位；负分数也要按数值定位。"], "cautions": ["同一条数轴的单位长度必须一致，不能为了放下某个分数临时改一格的长度。", "负带分数的负号作用于整个带分数。"]}}, {"id": "ch1-q-exercise12-7", "locationId": "ch1-q-exercise12-7", "title": "习题1.2第7题", "preview": "负的D记录与题设所说的近视度数，含义并不相同。", "paragraphs": [], "learningRole": "练习", "learningGap": "先读懂带负号的记录，再按题设的程度条件筛选。", "learningAction": "能按题设记录换读程度、检查严格边界并自主统计符合条件的人数。", "related": [{"locationId": "ch1-source-absolute-definition", "label": "绝对值的距离定义", "purpose": "把绝对值读成点到原点的距离，再判断本题要用到哪部分信息。"}, {"locationId": "ch1-source-comparison-rules", "label": "有理数大小比较的规则", "purpose": "回看正数、0、负数之间及两个负数的比较条件，再选择本题需要的规则。"}], "questionGuide": {"knowledgePoints": ["题干用−0.50D对应近视50度、−1.00D对应近视100度；比较时要先按题干的记录方式统一D值与度数。", "绝对值表示不计方向的大小；本题的“超过”要求大于给定度数，恰好等于不算超过。"], "method": ["从题干给出的对应实例确认D值与所述度数如何对应，不直接把负记录当作负的程度。", "统一记录方式与比较条件的单位，逐条检查是否满足题目给定的“超过”要求，再统计人数。"], "cautions": ["数轴上更小的负数与更小的程度不是一回事。", "“超过”不包括恰好等于边界；此处只依据题干条件完成数学筛选，不将其推广为个人配镜结论。"]}}, {"id": "ch1-opposite-distance-practice", "locationId": "ch1-opposite-distance-practice", "title": "习题1.2第8题", "preview": "同时用好相反数的位置条件和两点间的距离。", "paragraphs": [], "learningRole": "练习", "learningGap": "同时用好相反数的位置条件和两点间的距离。", "learningAction": "能区分两点间距离与到原点距离，用相反数条件自主建立并解决位置关系。", "related": [{"locationId": "ch1-opposite-geometry", "label": "相反数在数轴上的位置", "purpose": "用关于原点的位置关系辨认和检查相反数。"}, {"locationId": "ch1-source-absolute-definition", "label": "绝对值的距离定义", "purpose": "把绝对值读成点到原点的距离，再判断本题要用到哪部分信息。"}], "questionGuide": {"knowledgePoints": ["非零的两个相反数在数轴原点两侧，到原点的距离相等。", "两点间的距离要从一个点量到另一个点；每个点到原点的距离，只从该点量到原点，两者量的对象不同。"], "method": ["在草图上区分题目给出的两点间距离与每个点到原点的距离。", "用“互为相反数”检查两点相对原点的位置关系，再将两点间的距离与各自到原点的距离联系起来。"], "cautions": ["不能把题目给出的5直接作为每个数的绝对值。", "题目没有规定A、B哪一个在右侧；说明两个数时，不要无依据地固定字母对应。"]}}, {"id": "ch1-opposite-conditions-practice", "locationId": "ch1-opposite-conditions-practice", "title": "习题1.2第9题", "preview": "找的是一类a的条件，代入个例只能帮助观察。", "paragraphs": [], "learningRole": "练习", "learningGap": "找的是一类a的条件，代入个例只能帮助观察。", "learningAction": "能按符号分类检验三个关系，提出完整条件并说明一般理由。", "related": [{"locationId": "ch1-source-opposite-minus", "label": "在一个数前添负号的规定", "purpose": "回看“添上负号”表示取相反数的原文，先认清负号作用于哪个数。"}, {"locationId": "ch1-opposite-geometry", "label": "相反数在数轴上的位置", "purpose": "用关于原点的位置关系辨认和检查相反数。"}, {"locationId": "ch1-order-on-axis", "label": "数轴上的大小顺序", "purpose": "根据左右位置比较a与它的相反数，分别检查符号和0的情况。"}], "questionGuide": {"knowledgePoints": ["a和−a互为相反数；非零时，它们分居原点两侧，到原点的距离相等。", "同一条数轴上，点重合表示数相等，左边的数小于右边的数；可用这两种位置关系分别检查题中三个条件。"], "method": ["借助相反数的对称位置，怎样比较a与−a？分别为（1）的相等关系与（2）（3）的不等关系寻找成立条件。", "用数轴解释所得条件为何包含所有可能；代入例子可以检验，但不能代替一般理由。"], "cautions": ["不要假定−a一定为负。", "“满足什么条件”应说明完整范围；一个例子成立不等于已经找全条件。"]}}, {"id": "ch1-q-activity-1", "locationId": "ch1-q-activity-1", "title": "数学活动1：体重调查", "preview": "同一张表中，方向、接近程度和整体情况需要不同信息。", "paragraphs": [], "learningRole": "探究", "learningGap": "同一张表中，方向、接近程度和整体情况需要不同信息。", "learningAction": "能区分偏差方向和程度，分析题设记录并按统一方式开展小组记录与讨论。", "related": [{"locationId": "ch1-deviation", "label": "标准量与偏差", "purpose": "区分实际量与相对标准超出或不足的记录。"}, {"locationId": "ch1-source-absolute-definition", "label": "绝对值的距离定义", "purpose": "把绝对值读成点到原点的距离，再判断本题要用到哪部分信息。"}], "questionGuide": {"knowledgePoints": ["本题规定：超过标准体重的千克数记为正，少于标准体重的千克数记为负；表中记录的是与标准相差的量。", "记录的正负区分超过或不足，绝对值说明相差多少；两项信息都要与同学编号、所用标准和单位对应。"], "method": ["（1）依据题设正负约定识别记录的意义，再用数据说明超过或少于标准的情况。", "（2）先判断“最符合标准”应关注方向还是偏离程度；讨论整体情况时，同时查看各记录的符号和偏离大小。", "后续调查按题设计算方式与统一单位填写记录，核对每人的实际量和所用基准；讨论运动方案时，按原页要求另行查阅资料或咨询体育老师。"], "cautions": ["表中记录是偏差，不是实际体重；年龄不同还可能对应不同基准。", "这一活动使用题设的标准比较记录，不能只凭一条偏差概括个人健康状况。", "汇总时保留编号、单位和计算依据，避免把不同对象的数据错配。"]}}, {"id": "ch1-deviation-distance-activity", "locationId": "ch1-deviation-distance-activity", "title": "“最符合标准”是在比较什么？", "preview": "正负说明偏向哪边，接近程度还要看偏离多少。", "paragraphs": ["在这道活动的记录中，0表示恰好等于题目所用的标准。正负只能区分超过还是少于标准，不能单凭“正”或“负”判断哪条记录更接近标准。", "可以把表中记录看作数轴上的点，想一想“最符合标准”应观察点与哪个位置的关系。比较时要同时区分偏离的方向和程度，再自己判断各条记录。"], "learningRole": "探究", "learningGap": "活动从是否超过标准转为最符合标准，需要识别符号和偏离程度回答不同问题。", "learningAction": "能把“接近标准”与偏差到0的距离联系起来，自行比较表中记录。", "related": [{"locationId": "ch1-source-absolute-definition", "label": "绝对值的距离定义", "purpose": "把绝对值读成点到原点的距离，再判断本题要用到哪部分信息。"}]}, {"id": "ch1-q-activity-2", "locationId": "ch1-q-activity-2", "title": "数学活动2：猜数游戏", "preview": "把“大了、小了、相等”转换成有效的候选范围。", "paragraphs": [], "learningRole": "探究", "learningGap": "把“大了、小了、相等”转换成有效的候选范围。", "learningAction": "能按每次反馈更新整数候选范围，并用可比较的记录检验猜数策略。", "related": [{"locationId": "ch1-order-on-axis", "label": "数轴上从左到右、从小到大的规定", "purpose": "回到教材的大小顺序规定，再按本题要求比较或排列。"}, {"locationId": "ch1-source-comparison-rules", "label": "有理数大小比较的规则", "purpose": "回看正数、0、负数之间及两个负数的比较条件，再选择本题需要的规则。"}, {"locationId": "ch1-guess-range", "label": "回答怎样缩小范围", "purpose": "检查一次回答提供的大小约束。"}, {"locationId": "ch1-guess-strategy-check", "label": "怎样检验策略", "purpose": "回顾可比较的试验记录。"}], "questionGuide": {"knowledgePoints": ["秘密数是题目范围内的整数；“大了”“小了”说的是所猜的数与秘密数的大小关系，不是描述秘密数的正负。", "数轴上左边的数小于右边的数；每次回答都给出一个新的大小条件，后续候选数须同时符合以前的所有回答。"], "method": ["听到“大了”时，是谁比谁大？下一次猜测应如何兼顾以前的所有回答？", "自己提出猜测的办法，用同一组秘密数记录每轮候选范围和所用次数，检查办法怎样利用已有反馈。"], "cautions": ["已经排除的数不应又被列回候选范围。", "一次碰巧猜中不足以说明策略更快；允许范围两端和中间的数都应参与检验。", "只要求选择整数，不要在调整过程中把小数当作秘密数候选。"]}}, {"id": "ch1-guess-range", "locationId": "ch1-guess-range", "title": "一次回答怎样缩小下一次的范围？", "preview": "记录还可能的数，也记录已经排除的数。", "paragraphs": ["没有猜中时，“大了”或“小了”提供了一个大小关系。它不只是让你换一个数试试，还能排除不符合这个关系的一整部分数；已经猜过且不相等的数也可以排除。", "每次调整后，保留下来的数应同时符合此前的全部回答。可以在数轴上标出仍可能的范围，再决定下一次猜什么，避免重新猜已被排除的数。"], "learningRole": "探究", "learningGap": "步骤只说根据回答调整猜想，未展开回答约束候选范围以及多次约束需同时满足。", "learningAction": "能依据每次回答更新可能范围，并检查新猜想是否符合此前全部条件。", "related": [{"locationId": "ch1-order-on-axis", "label": "数轴上的大小顺序", "purpose": "把“大了”或“小了”转成数轴上的位置关系，检查还可能的范围。"}]}, {"id": "ch1-guess-strategy-check", "locationId": "ch1-guess-strategy-check", "title": "怎样判断一种猜数策略更快？", "preview": "一次碰巧猜中，不足以判断策略的效果。", "paragraphs": ["一次游戏中猜得很快，可能因为秘密数恰好接近第一次的猜想。检验策略时，可以记录每轮猜测后还剩多少可能的数，以及最后用了几次，看看策略如何利用每次得到的信息。", "比较不同策略时，尽量用同一组秘密数，也包含靠近两端和中间的数。这样可以减少题目不同带来的影响；不要只挑对自己策略有利的一次结果。"], "learningRole": "探究", "learningGap": "教材提出“多做几次检验”，但未说明怎样观察与公平比较策略以区别偶然猜中。", "learningAction": "能设计可比较的试玩记录，用候选范围和猜测次数检查自己提出的策略。", "related": []}, {"id": "ch1-number-extension-review", "locationId": "ch1-number-extension-review", "title": "数的范围扩大，原来的数还在吗？", "preview": "引入负数是在原有数的范围上增加新的数。", "paragraphs": ["“扩大”表示原来的正整数、正分数和0仍然保留，再加入负整数、负分数。它不是把旧的数换掉，也不是说原来所有的计算和比较都要重新否定。", "数轴使这个变化更直观：原点右边仍表示正数，左边提供了负数的位置。理解新的范围时，可以同时检查“新增了哪些数”和“原有数的含义是否保持”。"], "learningRole": "回顾与整理", "learningGap": "章小结说数的范围扩大，但未拆清新增对象与保留原有数之间的关系。", "learningAction": "能说明有理数范围怎样包含原有的正整数、正分数和0，并指出新增的负数类别。", "related": [{"locationId": "ch1-source-rational-definition", "label": "有理数的原文定义", "purpose": "确认教材怎样规定有理数，再读本题要求辨认哪些数。"}]}, {"id": "ch1-number-line-review", "locationId": "ch1-number-line-review", "title": "同一条数轴，回答三个不同的问题", "preview": "相反数看对应位置，绝对值看距离，大小比较看左右。", "paragraphs": ["求一个数的相反数，是找与它关于原点对称的位置；求绝对值，是读出它到原点的距离；比较两个数的大小，是看它们的左右次序。这三件事借助同一条数轴，却在回答不同问题。", "特别要分清“更靠右”和“离原点更远”：前者决定数更大，后者决定绝对值更大。它们在负半轴上不会给出相同的排序。回顾时，可以用一对负数分别检验这两句话。"], "learningRole": "回顾与整理", "learningGap": "小结段说明数轴帮助研究相反数、绝对值和大小比较，但未并列区分这三种操作各读取什么信息，需要防止把数的大小和距离混用。", "learningAction": "能按问题选择看对称位置、距离或左右次序，并说明差别。", "related": [{"locationId": "ch1-opposite-geometry", "label": "相反数：看对称位置", "purpose": "回看相反数在数轴上怎样配对。"}, {"locationId": "ch1-source-absolute-definition", "label": "绝对值的距离定义", "purpose": "把绝对值读成点到原点的距离，再判断本题要用到哪部分信息。"}, {"locationId": "ch1-order-on-axis", "label": "大小比较：看左右次序", "purpose": "核对数轴左右次序与大小的约定，再和到原点的距离比较。"}]}, {"id": "ch1-q-recall-1", "locationId": "ch1-q-recall-1", "title": "回顾与思考第1题", "preview": "数的范围每次扩大，都对应原有数难以表达的需要。", "paragraphs": [], "learningRole": "回顾与整理", "learningGap": "用“原有范围—遇到的问题—新引入的数”整理扩充过程。", "learningAction": "能整理数的范围扩充顺序，并为各次扩充说明原有范围遇到的表达需要。", "related": [{"locationId": "ch1-number-extension-review", "label": "扩大范围与保留原有数", "purpose": "检查整理出的新旧数类关系。"}, {"locationId": "ch1-why-negative", "label": "为什么引入负数", "purpose": "回看正数记录未能表达的相反意义。"}], "questionGuide": {"knowledgePoints": ["数的产生和发展与计数、测量、运算等需要有关；引入新数时，原来认识的数仍保留在扩大的范围内。", "本章因表示具有相反意义的量而引入负数；回顾时还要说明，以前的数在哪个实际需要中不够用了。"], "method": ["先回忆已经学过哪些数，把原有数与新加入的数分开整理。", "对每次扩充，找一个原有范围不够表达的实际问题，说明新数解决了什么需要，再确定自己的整理顺序与次数。"], "cautions": ["不同写法未必代表不同的新数类，不能把每一种小数写法都算作一次范围扩大。", "扩大范围会包含原有数，不是把原有数替换掉。"]}}, {"id": "ch1-q-recall-2", "locationId": "ch1-q-recall-2", "title": "回顾与思考第2题", "preview": "例子要同时说清同类量、相反意义和正负约定。", "paragraphs": [], "learningRole": "回顾与整理", "learningGap": "例子要同时说清同类量、相反意义和正负约定。", "learningAction": "能构造同类量的相反意义实例，说清符号约定和记录的作用。", "related": [{"locationId": "ch1-source-opposite-quantities", "label": "用正负数表示相反意义", "purpose": "回到课本这条说明，检查本题的两种情况是不是同一种量的相反方面。"}, {"locationId": "ch1-source-positive-negative", "label": "正数、负数与0的规定", "purpose": "回看教材对正数、负数和0的规定，再判断本题中的数。"}], "questionGuide": {"knowledgePoints": ["同一种量的两种相反意义可用正负数表示；先约定哪一种为正，另一种就用负数表示。", "符号区分相反意义，数值大小说明具体数量；相反意义不要求两边数量相等。"], "method": ["从一个明确情境选出同类量的两种相反意义，说明以哪一种为正。", "用自己的记录解释符号负责区分什么、数值大小负责表达什么。"], "cautions": ["仅仅给出一个正数和一个负数，还没有交代实际意义。", "相反意义不要求两种数量大小相等，也不能把单位不同的量硬配成一对。"]}}, {"id": "ch1-q-recall-3", "locationId": "ch1-q-recall-3", "title": "回顾与思考第3题", "preview": "分类图的每一层，需要清楚而一致的分类标准。", "paragraphs": [], "learningRole": "回顾与整理", "learningGap": "画分类图前，先决定每一层采用什么标准。", "learningAction": "能按一致标准绘制有理数分类图，并用典型数检查完整性。", "related": [{"locationId": "ch1-source-integer-types", "label": "整数包括哪些数", "purpose": "回看正整数、0、负整数统称为整数的原文，再判断本题中的整数。"}, {"locationId": "ch1-source-fraction-types", "label": "正分数与负分数", "purpose": "对照课本列出的分数和小数，分清数的类别与写法。"}, {"locationId": "ch1-source-rational-definition", "label": "有理数的原 位置", "purpose": "用关于原点的位置关系辨认和检查相反数。"}], "questionGuide": {"knowledgePoints": ["绝对值表示一个点到原点的距离；距离和方向是不同信息，需要根据每一句给定的条件检查可能的位置。", "一个数与它的相反数，非零时所对应的点在原点两侧且离原点同样远；两个数相等则对应同一个点。"], "method": ["第一句检查给定距离是否足以唯一确定原数，特别关注“一定”要求的含义。", "第二句与第一句的距离条件不同，要重新检查允许的位置。", "第三句把“两数相等”转成“表示它们的点重合”，再检查什么位置同时满足相反数的关系。"], "cautions": ["不要把第一句的“距离”直接当成“原数”，也不要把同一套候选个数套在三句上。", "各问需要根据自己的条件判断，不能仅因相邻出现就认为答案相同或互相排斥。"]}}], LOC=[{"id": "ch1-why-negative", "page": 8, "printedPage": null, "indexAnchor": 1, "anchorLabel": "第一章引言", "locator": "章引言第（1）问：“北京冬季某一天的最高气温为零上3摄氏度……”题干两行。", "region": {"x": 0.13, "y": 0.222, "width": 0.79, "height": 0.047}, "marker": {"x": 0.95, "y": 0.2455}, "sourceImageSha256": "f1691755af1bacd9fedc2c430415ebc8c124bb6e9aca3f9ec8a13329f4858940"}, {"id": "ch1-intro-profit-question", "page": 8, "printedPage": null, "indexAnchor": 1, "anchorLabel": "第一章引言", "locator": "章引言第（2）问：“某公司今年7月份盈利50万元，8月份亏损10万元……”完整题干。", "region": {"x": 0.126534, "y": 0.277808, "width": 0.789877, "height": 0.049919}, "marker": {"x": 0.95, "y": 0.29}, "sourceImageSha256": "f1691755af1bacd9fedc2c430415ebc8c124bb6e9aca3f9ec8a13329f4858940"}, {"id": "ch1-intro-production-question", "page": 8, "printedPage": null, "indexAnchor": 1, "anchorLabel": "第一章引言", "locator": "章引言第（3）问：“某年，我国棉花产量比上年增长7.8%，玉米产量比上年减少0.7%。”完整题干。", "region": {"x": 0.126534, "y": 0.336408, "width": 0.789877, "height": 0.074878}, "marker": {"x": 0.95, "y": 0.347}, "sourceImageSha256": "f1691755af1bacd9fedc2c430415ebc8c124bb6e9aca3f9ec8a13329f4858940"}, {"id": "ch1-positive-negative", "page": 9, "printedPage": "2", "indexAnchor": 1, "anchorLabel": "正数；负数", "locator": "“在数学中，像3，50，7.8%这样大于0的数叫作正数”至“其中符号‘−’是负号”的定义语句。", "region": {"x": 0.085, "y": 0.728, "width": 0.79, "height": 0.051}, "marker": {"x": 0.925, "y": 0.752}, "sourceImageSha256": "a18d3af40da5234bb14eaabb06f78e3a3cb33e03dd6fbf8fb25ff0aeac09402d"}, {"id": "ch1-zero-boundary", "page": 9, "printedPage": "2", "indexAnchor": 1, "anchorLabel": "正数；负数", "locator": "页底独立句：“0既不是正数，也不是负数 function drawer(){if(!state.selected)return '';const s=DATA.find(x=>x.id===state.selected);if(!s)return '';return `<aside class="drawer" aria-label="补充解读"><div class="drawer-head"><span class="badge" style="background:#fff0bf">✧ 补充解读</span><div>${state.history.length?btn('返回','back()','quiet'):''}${btn('×',"state.selected=null;render()",'quiet icon')}</div></div><h2>${esc(s.title)}</h2><div class="drawer-content"><div>${s.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}${s.questionGuide?`<div class="callout">${s.questionGuide.knowledgePoints.map(esc).join('<br>')}</div><details><summary>思路与方法</summary>${s.questionGuide.method.map(p=>`<p>${esc(p)}</p>`).join('')}</details><p class="muted">${s.questionGuide.cautions.map(esc).join('<br>')}</p>`:''}</div><div>${s.related.length?'<h3>回到相关知识</h3>':''}${s.related.map(r=>{let target=DATA.find(d=>d.locationId===r.locationId);return `<button class="related" onclick="${target?`openSup('${target.id}',true)`:`state.history.push({id:state.selected,page:state.page});state.page=${LOC.find(l=>l.id===r.locationId)?.page||9};state.view='reader';render();toast('已定位相关原页，可在解读中返回')`}">${esc(r.label)} ↗<br><small>${esc(r.purpose)}</small></button>`}).join('')}<details><summary>我的笔记</summary><textarea aria-label="我的笔记" placeholder="用自己的话记下一点理解…" oninput="window.noteDraft=this.value">${esc(window.noteDraft||'')}</textarea><p class="muted">仅用于本次预览，不会保存。</p></details></div></div></aside>`}
function bookpane(){const l=LOC.find(x=>x.id===state.selected&&x.page===state.page);return `<section class="bookpane"><div class="toolbar">${btn('☰',"state.catalog=!state.catalog;render()",'quiet icon')}<div class="pages">${btn('‹','changePage(state.page-1)','quiet icon')}<input aria-label="页码" type="number" min="1" max="202" value="${state.page}" onchange="changePage(this.value)"><span>/ 202</span>${btn('›','changePage(state.page+1)','quiet icon')}</div>${btn('✧',"openSup('ch1-why-negative')",'quiet icon')}</div><div class="canvas"><div class="page"><img src="${base}page-${state.page}.webp" alt="教材第${state.page}页">${l?`<div class="highlight" style="left:${l.region.x*100}%;top:${l.region.y*100}%;width:${l.region.width*100}%;height:${l.region.height*100}%"></div>`:''}${state.markers?LOC.filter(l=>l.page===state.page&&DATA.some(s=>s.id===l.id)).map(l=>`<button class="marker" aria-label="查看${esc(DATA.find(s=>s.id===l.id).title)}" style="left:${l.marker.x*100}%;top:${l.marker.y*100}%" onclick="openSup('${l.id}')">✧</button>`).join(''):''}</div></div></section>`}
function graph(){const nodes=[['ch1-why-negative','零上与零下温度',50,45,'题目引导','#f7cd67'],['ch1-positive-negative','负号与减号',23,23,'概念与性质','#c6d0f7'],['ch1-zero-boundary','为什么 0 要单独留下？',77,25,'概念与性质','#c6d0f7'],['ch1-opposite-meanings','相反意义',23,72,'方法与推理','#e5cef7'],['ch1-intro-production-question','产量增长与减少',76,73,'题目引导','#f7e4ac']];return `<section class="graph-wrap"><div class="toolbar"><strong style="margin-right:auto">第一章的知识联系</strong>${btn('☰',"state.catalog=!state.catalog;render()",'quiet icon')}${btn('回到教材',"go('reader')")}</div><div class="graph-scene"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${nodes.slice(1).map(n=>`<path d="M50 45 Q${n[2]} 45 ${n[2]} ${n[3]}" fill="none" stroke="#b7aa8e" stroke-width=".35"/>`).join('')}</svg>${nodes.map(n=>`<button class="node ${state.selected===n[0]?'current':''}" style="left:${n[2]}%;top:${n[3]}%;background:${n[5]}" onclick="openSup('${n[0]}')"><small>${n[4]}</small>${n[1]}</button>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#889df0"></i>概念</span><span><i class="dot" style="background:#b77dee"></i>方法</span><span><i class="dot" style="background:#f7cd67"></i>问题</span><span>示意联系 · 可点节点</span></div></section>`}
function gallery(){return `<section class="gallery"><div class="ribbon">小岛的设计语言</div><h1>同一套风格，贯穿阅读</h1><p>奶油纸色、薄荷绿和暖棕文字。把活泼留给入口，把安静留给课本。</p><div class="gallery-grid"><section class="spec-card"><h2>色彩与语义</h2><div class="row">${[['纸面','#f8f8f0'],['面板','#f7f3df'],['正文','#725d42'],['主操作','#19c8b9'],['概念','#889df0'],['方法','#b77dee'],['问题','#f7cd67'],['回顾','#82d5bb'],['个人','#f8a6b2']].map(c=>`<div class="swatch"><i style="background:${c[1]}"></i>${c[0]}<br>${c[1]}</div>`).join('')}</div></section><section class="spec-card"><h2>按钮与选择</h2><div class="row">${btn('继续阅读',"go('reader')",'primary')}${btn('次要操作',"toast('次要操作反馈')")}${btn('文本操作',"toast('文本操作反馈')",'quiet')}<button disabled>暂不可用</button></div><p>主要操作采用 5px 暖色压印，普通按钮保持轻巧。点击、悬停和键盘焦点均可体验。</p><div class="row"><span class="badge">默认标签</span><span class="badge" style="background:#b7c6e5">目录选中</span><span class="badge" style="background:#fff0bf">补充解读</span></div></section><section class="spec-card"><h2>输入与反馈</h2><label>搜索内容 <input placeholder="搜索知识或题目" oninput="document.querySelector('#searchHint').textContent=this.value?'原型搜索：'+this.value:'输入文字体验焦点状态'"></label><p id="searchHint" class="muted">输入文字体验焦点状态</p><div class="status success">✓ 笔记已保存 · 状态样式</div><div class="status warning">◇ 当前内容尚未核对 · 状态样式</div><div class="status error">! 保存失败，请重试 · 状态样式</div><div class="status" style="background:#f0e8d8" role="status">◌ 正在载入教材…<br><small>保留当前阅读位置，等待内容出现。</small></div><div style="border:2px dashed var(--line);border-radius:18px;padding:20px;margin-top:14px;text-align:center"><strong>▤ 这里还没有个人笔记</strong><p class="muted" style="margin:8px auto">读到有启发的地方，用自己的话记下来。</p><button onclick="toast('空状态操作示意：打开笔记编辑器')">写第一条笔记</button></div></section><section class="spec-card"><h2>排版与空间</h2><h3>标题 24 / 32 · 正文 16 / 26</h3><p>界面使用圆润无衬线字体；教材原页不改变。间距遵循 4、8、12、16、24、32；面板圆角 24，内容块 18，输入与按钮为胶囊形。</p><details><summary>展开与收起</summary><p>只在需要时展开方法和个人笔记，保持原文阅读连续。</p></details>${btn('预览设置窗口',"settingsDialog.showModal()")}</section></div><p class="muted">设计来源：Animal Island UI。此原型为相似组件实现，未安装组件库。图谱关系为布局示意，未替代正式知识数据。</p></section>`}
function render(){document.body.classList.toggle('bottom',state.variant==='B');main.innerHTML=state.view==='shelf'?shelf():state.view==='gallery'?gallery():`<section class="reader">${state.catalog?catalog():''}<div class="reading-workspace">${state.view==='graph'?graph():bookpane()}${drawer()}</div></section>`;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));document.querySelector('#variantLabel').textContent=`${state.variant} · ${state.variant==='A'?'侧边伴读':'页下伴读'} · ${state.view==='shelf'?'书架':state.view==='reader'?'阅读':state.view==='graph'?'图谱':'风格集'}`;}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.querySelector('#settings').onclick=()=>settingsDialog.showModal();document.querySelector('#fontSize').onchange=e=>document.documentElement.style.setProperty('--body',e.target.value+'px');document.querySelector('#showMarkers').onchange=e=>{state.markers=e.target.checked;render()};document.querySelector('#layout').onchange=e=>{state.variant=e.target.value;setVariant()};document.querySelector('#prevVariant').onclick=variant;document.querySelector('#nextVariant').onclick=variant;document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||settingsDialog.open)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){variant();e.preventDefault()}if(e.key==='Escape'&&state.selected){state.selected=null;render()}});document.querySelector('#layout').value=state.variant;render();
</script></body></html>
